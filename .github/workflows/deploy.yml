name: Deploy to All-Inkl via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTPS
        timeout-minutes: 8
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" \
            -e "set ssl:verify-certificate false; set ssl:check-hostname false; set ftp:ssl-force true; mirror --reverse --delete --exclude-glob .git --exclude-glob .github ./ /pelvipoint.de/; quit" \
            ftp://"$FTP_SERVER"
